global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  - job_name: order-processor
    metrics_path: /actuator/prometheus
    # Resolves every replica when the service is scaled.
    dns_sd_configs:
      - names: ["order-processor"]
        type: A
        port: 8081

  - job_name: rabbitmq
    # per-object gives one series per queue (depth, consumers, ack rates).
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
